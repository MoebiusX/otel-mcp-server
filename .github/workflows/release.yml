name: Release

# Publishes the package to npm with provenance when a version tag is pushed.
# Tag the release commit (e.g. `git tag v1.3.0 && git push origin v1.3.0`).
# Requires the `NPM_TOKEN` repository secret (an npm automation token with
# publish rights to the @moebiusx scope).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # manual trigger for publish/auth diagnostics

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Build, test & publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Diagnose npm auth (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          echo "::group::npm whoami"
          npm whoami || echo "whoami failed (token not authenticating)"
          echo "::endgroup::"
          echo "::group::org membership (moebiusx)"
          npm org ls moebiusx 2>&1 || echo "cannot list org moebiusx (not a member / no access)"
          echo "::endgroup::"
          echo "::group::writable packages/scopes"
          npm access list packages 2>&1 || echo "cannot list package access"
          echo "::endgroup::"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@moebiusx/otel-mcp-server@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "Version ${VERSION} already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            moebiusx/otel-mcp-server:${{ steps.version.outputs.version }}
            moebiusx/otel-mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
