name: Secret scan

# Scans the commits introduced by a push or pull request with gitleaks,
# using .gitleaks.toml (built-in rules + this project's key format).
# Passwords typed into commands (PGPASSWORD=, sshpass -p, URI credentials)
# are covered by the built-in rules; see the Apiiro report on
# .claude/settings.local.json for why that matters for agent-driven repos.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the push/PR range can be diffed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
