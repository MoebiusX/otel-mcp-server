name: Rebuild image

# A one-off, image-only rebuild of the tagged source on the current Node 22
# base (the October 2026 security release, CVE-2026-111497): the same Docker
# job as release.yml, without the npm publish it depends on there. Dispatched
# on a release branch; the image tag is the version in package.json.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
            BUILD_VERSION=v${{ steps.version.outputs.version }}
          tags: |
            moebiusx/otel-mcp-server:${{ steps.version.outputs.version }}
            moebiusx/otel-mcp-server:latest
